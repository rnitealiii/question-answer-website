<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Answer</title>
<style>
:root {
  --ink: #18191b;
  --muted: #777b83;
  --line: #e7e8eb;
  --surface: #ffffff;
  --page: #f6f7f8;
  --soft: #f8f9fa;
  --accent: #1b1c1f;
  --success: #176b45;
  --success-bg: #eaf7ef;
  --error: #a33a32;
  --error-bg: #fff0ee;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.page-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 16px; }
.app-card { width: 100%; max-width: 470px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 32px; box-shadow: 0 12px 40px rgba(20, 24, 30, .045); }
.brand { text-align: center; margin: 0 0 28px; }
.brand-mark { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; border-radius: 14px; color: white; background: var(--ink); font-size: 20px; font-weight: 750; margin-bottom: 15px; }
.brand h1 { margin: 0; font-size: 25px; letter-spacing: -.8px; }
.brand p { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
.question-form { display: flex; flex-direction: column; gap: 10px; }
label { font-size: 13px; font-weight: 650; color: #363940; }
textarea, input[type="password"] { width: 100%; border: 1px solid #dedfe3; border-radius: 12px; padding: 13px 14px; background: #fff; color: var(--ink); outline: none; resize: vertical; transition: border-color .15s, box-shadow .15s; }
textarea:focus, input:focus { border-color: #8e929a; box-shadow: 0 0 0 3px rgba(50, 55, 65, .07); }
textarea::placeholder, input::placeholder { color: #a0a3aa; }
button[type="submit"], .upload-form > button, .manual-form > button { border: 0; background: var(--accent); color: white; border-radius: 12px; min-height: 46px; padding: 12px 16px; font-weight: 650; transition: opacity .15s, transform .15s; }
button[type="submit"]:hover, .upload-form > button:hover, .manual-form > button:hover { opacity: .88; }
button:disabled { opacity: .6; cursor: wait; }
#submit-btn { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 3px; }
.status { margin-top: 15px; padding: 10px 12px; border-radius: 10px; font-size: 12px; }
.status-match { color: var(--success); background: var(--success-bg); }
.status-not-found { color: var(--error); background: var(--error-bg); }
.result-card { margin-top: 16px; padding: 17px 18px; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; }
.explanation-card { background: #fff; }
.result-heading { display: flex; align-items: center; gap: 8px; }
.result-heading h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; margin: 0; color: #656972; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.answer-dot { background: #2d8a60; }
.explanation-dot { background: #9a83dc; }
.result-text { margin: 11px 0 0; font-size: 14px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.footer { margin-top: 28px; padding-top: 17px; border-top: 1px solid #f0f0f2; display: flex; align-items: center; justify-content: space-between; color: #9a9da4; font-size: 11px; }
.footer a, .text-link, .download-link, .back-link { color: #60636b; text-decoration: none; }
.footer a:hover, .text-link:hover, .download-link:hover, .back-link:hover { color: #111; text-decoration: underline; }
[hidden] { display: none !important; }
.admin-card { max-width: 430px; }
.back-link { font-size: 13px; display: inline-block; margin-bottom: 22px; }
.compact-brand { margin-bottom: 24px; }
.small-note { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 12px 0 0; }
.flash { padding: 12px 14px; border-radius: 11px; font-size: 13px; line-height: 1.5; margin: 12px 0 18px; }
.flash-success { background: var(--success-bg); color: var(--success); }
.flash-error { background: var(--error-bg); color: var(--error); }
.admin-shell { max-width: 1080px; margin: 0 auto; padding: 26px 22px 40px; }
.admin-topbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 23px; border-bottom: 1px solid var(--line); }
.admin-brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font-weight: 750; letter-spacing: -.3px; }
.small-mark { width: 32px; height: 32px; border-radius: 10px; font-size: 16px; margin: 0; }
.top-actions { display: flex; align-items: center; gap: 18px; }
.top-actions form { margin: 0; }
.text-link { font-size: 13px; }
.button-light { border: 1px solid var(--line); background: white; padding: 9px 13px; border-radius: 10px; color: #41444b; font-size: 12px; }
.admin-intro { padding: 30px 0 18px; }
.eyebrow { color: #888c95; letter-spacing: 1.5px; font-size: 10px; font-weight: 750; margin: 0 0 9px; }
.admin-intro h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: -1.1px; }
.admin-intro > p:last-child { color: var(--muted); font-size: 14px; margin: 9px 0 0; }
.admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
.panel { background: white; border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-top: 14px; min-width: 0; }
.admin-grid .panel { margin-top: 0; }
.panel-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 19px; }
.panel-heading h2 { margin: 0; font-size: 16px; letter-spacing: -.3px; }
.panel-heading p { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
.panel-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: #f3f4f5; color: #4c5058; font-size: 18px; }
.upload-form, .manual-form { display: flex; flex-direction: column; gap: 10px; }
.upload-zone { min-height: 155px; border: 1px dashed #cfd1d6; border-radius: 13px; background: #fafbfb; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 7px; text-align: center; cursor: pointer; padding: 16px; }
.upload-symbol { width: 30px; height: 30px; display: grid; place-items: center; background: white; border: 1px solid var(--line); border-radius: 9px; font-size: 18px; }
.upload-zone strong { font-size: 13px; }
.upload-zone span:last-of-type { color: var(--muted); font-size: 11px; font-weight: 400; }
.upload-zone input { max-width: 220px; font-size: 11px; margin-top: 4px; }
.upload-form .small-note { margin: 2px 0 5px; }
.download-link { display: inline-block; margin-top: 14px; font-size: 12px; }
.manual-form label:not(:first-child) { margin-top: 3px; }
.manual-form textarea { min-height: 65px; }
.count-pill { background: #f1f2f4; border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 700; }
.entries-panel { margin-top: 18px; }
.entries-list { border-top: 1px solid #f0f0f2; }
.entry { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 17px 0; border-bottom: 1px solid #f0f0f2; }
.entry:last-child { border-bottom: 0; }
.entry-copy { min-width: 0; }
.entry h3 { margin: 0 0 8px; font-size: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.entry p { margin: 5px 0 0; font-size: 12px; line-height: 1.6; color: #656972; overflow-wrap: anywhere; }
.entry-explanation { color: #888b92 !important; }
.delete-button { border: 1px solid #f0d4d1; background: white; color: #a33a32; border-radius: 9px; padding: 7px 9px; font-size: 11px; }
.empty-state { text-align: center; padding: 30px 12px 24px; color: var(--muted); }
.empty-state span { font-size: 25px; }
.empty-state h3 { color: var(--ink); font-size: 14px; margin: 10px 0 5px; }
.empty-state p { font-size: 12px; margin: 0; }
.admin-footnote { text-align: center; font-size: 11px; line-height: 1.6; color: #92959d; margin: 20px 0 0; }
@media (max-width: 720px) {
  .admin-grid { grid-template-columns: 1fr; }
  .admin-shell { padding: 18px 14px 28px; }
  .panel { padding: 18px; }
}
@media (max-width: 420px) {
  .app-card { padding: 24px 20px; border-radius: 19px; }
  .admin-topbar { align-items: flex-start; }
  .top-actions { gap: 10px; flex-direction: column; align-items: flex-end; }
}

/* ---- Welcome / subscribe modal ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:1rem}
.modal-card{background:#fff;border-radius:1rem;max-width:26rem;width:100%;padding:1.75rem 1.5rem;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-card h2{margin:0 0 .5rem;font-size:1.35rem}
.modal-card p{margin:.4rem 0 1rem;color:#475569}
.modal-card input{width:100%;padding:.7rem .9rem;border:1.5px solid #cbd5e1;border-radius:.6rem;font-size:1rem;margin-bottom:.9rem;box-sizing:border-box}
.modal-card input:focus{outline:none;border-color:#2563eb}
.modal-btn{display:inline-block;background:#2563eb;color:#fff;border:none;border-radius:.6rem;padding:.7rem 1.6rem;font-size:1rem;cursor:pointer}
.modal-btn:hover{background:#1d4ed8}
.modal-skip{display:block;margin-top:.7rem;color:#64748b;font-size:.85rem;cursor:pointer;background:none;border:none}
.subscribe-btn{display:inline-flex;align-items:center;gap:.5rem;background:#ff0000;color:#fff;text-decoration:none;font-weight:700;border-radius:2rem;padding:.75rem 1.8rem;font-size:1.05rem;margin:.4rem 0 .8rem}
.subscribe-btn:hover{background:#cc0000}
.modal-thanks{color:#16a34a;font-weight:600;margin-top:.4rem}
.modal-name{color:#2563eb;font-weight:700}
</style>
</head>
<body>
<main class="page-shell">
<section class="app-card">
<header class="brand">
<div class="brand-mark">Q</div>
<h1>Question Answer</h1>
<p>Ask a question. Get a clear answer.</p>
</header>
<form id="ask-form" class="question-form">
<label for="question">Your question</label>
<textarea id="question" name="question" rows="3" placeholder="Type your question here..." required></textarea>
<button id="submit-btn" type="submit">Find answer <span aria-hidden="true">&rarr;</span></button>
</form>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<section id="answer-card" class="result-card" hidden>
<div class="result-heading"><span class="dot answer-dot"></span><h2>Answer</h2></div>
<p id="answer-text" class="result-text"></p>
</section>
<section id="explanation-card" class="result-card explanation-card" hidden>
<div class="result-heading"><span class="dot explanation-dot"></span><h2>Explanation</h2></div>
<p id="explanation-text" class="result-text"></p>
</section>
<footer class="footer">
<span>Knowledge, made simple.</span>
<span>99 GoTranscript questions</span>
</footer>
</section>
</main>
<script>
const QA = [{"q": "The sound made by the speaker is always written on the same line, in the present tense.", "a": "a — On the same line and in the present tense.", "e": "GoTranscript's sound-events rule requires significant sounds to be noted in square brackets, in present or progressive tense, lowercase, and no more than two words. Sounds that occur while the speaker is talking are kept on the same line as the speech; ambient sounds and pauses go on separate lines. Parentheses must never be used instead of brackets."}, {"q": "If the speaker uses a filler / unclear word, what do you do?", "a": "Remove the filler word (keep it only if removing it would change the meaning)", "e": "In clean verbatim, filler words (um, uh, you know, I mean, kind of, sort of) are removed whenever the sentence stays perfectly understandable without them. A filler is only kept when removing it would change the meaning of the phrase. Note: expressions like 'Oh my God' must always be kept regardless of verbatim type."}, {"q": "If the speaker says their name, what is the correct spelling?", "a": "Spell the name the correct, researched way — never guess from how it sounded", "e": "GoTranscript requires transcribers to always research proper spelling and capitalization (the guidelines cite examples like iPhone and UCLA) — so a speaker's name must be spelled the correct, researched way, not the way it sounded. Misspoken words are likewise written with their correct spelling. Never guess a spelling from context."}, {"q": "If there is a word you cannot make out, what do you do?", "a": "c — Mark it as [unintelligible 00:00:00]", "e": "If you cannot make out a word, the guidelines forbid guessing or inventing your own marking. Use [unintelligible 00:00:00] when speech can be heard but not understood (accent, manner of speech), always with the timestamp. Only [inaudible 00:00:00] and [unintelligible 00:00:00] are allowed — nothing else."}, {"q": "When the speaker's name is mentioned in the audio, what do you do? (Use their name as the speaker label.)", "a": "c — Use their name for a speaker label", "e": "The speaker-label rule says: if the speaker's name is mentioned at some point, or indicated in the file title, use it as the speaker's label. A full name may later be shortened to the first name (David Butterfield: becomes David:). Once the name is known, generic 'Speaker' labels are not used."}, {"q": "When you are not sure who is speaking, which of the following is correct?", "a": "a — ?Speaker.", "e": "When you cannot identify exactly who is speaking, the guidelines say to add a question mark before the speaker label — e.g. ?David or ?Speaker 3. Speaker labels are always written bold, followed by a colon and exactly one space, never with a tab."}, {"q": "When can you remove the connectors? What are the timestamp rules?", "a": "Drop unnecessary conjunctions (only if the sentence stays understandable); timestamps every 2 minutes and on every speaker change", "e": "In clean verbatim, unnecessary conjunctions are cut: avoid starting phrases with conjunctions, and when a conjunction joins long stretches of thought, split into sentence divisions and drop the conjunction where it is not needed. Conjunctions are only removed when the sentence stays perfectly understandable. Timestamps go every 2 minutes and on every speaker change, always bold [00:00:00]."}, {"q": "If there is no system sound / the file is silent — do you report the file?", "a": "Report the file to GoTranscript", "e": "The guidelines say files with horrible audio quality should be reported to GoTranscript so they can contact the client and arrange a refund — you do not just submit an empty transcript. A file with no sound at all is exactly such a case: report the file instead of transcribing nothing."}, {"q": "If there is a lot of background noise, which symbols/signs are used in the audio?", "a": "[background noise] — on a separate line; on the same line if it occurs while the speaker is talking", "e": "For ambient background noise the guidelines use [background noise] on a separate line. If a significant unidentified sound occurs while the speaker is talking, [background noise] goes on the same line. Tags are always in square brackets, lowercase, present tense."}, {"q": "While transcribing an audio file, clean verbatim is the foundation. (Which statement is correct?)", "a": "True — clean verbatim is the default foundation", "e": "Clean verbatim is the default foundation: the transcript omits speech errors, false starts (unless they add information), stutters, repetitions and filler words, while keeping the speaker's meaning intact. Slang is expanded to full forms (gonna becomes going to) and yeah/yep become yes. The text must read fluently without editing the speaker's actual words."}, {"q": "Paragraphs should be within five lines. (Which statement is correct?)", "a": "True — paragraphs max ~500 symbols (about 100 words / 3-4 lines)", "e": "Longer speeches must be split into smaller paragraphs — paragraphs should not be longer than 500 symbols (about 100 words, or 3-4 lines in the transcription tool). The only exception is lyrics, which are transcribed like a poem."}, {"q": "Every sentence should be capitalized. (Which statement is correct?)", "a": "True — every sentence starts with a capital letter and ends with a punctuation mark", "e": "Every sentence must begin with a capital letter, and every sentence must end with a punctuation mark. The only exceptions for the ending mark: when the sentence ends with a double dash (incomplete sentence), or with an unintelligible/inaudible tag when you cannot tell whether it was a question."}, {"q": "Editing people's words is not a transcriber's job; keep paragraphs short. (Which statement is correct?)", "a": "True — never paraphrase or correct the speaker's words; keep paragraphs short", "e": "A transcriber must never paraphrase or reconstruct the speech, and must never correct the speakers' grammatical errors — editing people's words is not the job. Paragraphs stay short (500 symbols max), but the content itself is transcribed exactly as said, with meaning preserved."}, {"q": "In clean verbatim transcription, incomplete sentences are not included. (Which statement is correct?)", "a": "True — incomplete sentences / false starts are omitted unless they add information", "e": "Clean verbatim omits false starts unless they add information — so incomplete sentences that carry no extra information are left out. Speech errors, stutters and repetitions are likewise removed in clean verbatim. Only false starts that add new information are kept."}, {"q": "Paragraph length in conversational dialogue: three to four lines / 100 words. (Which is correct?)", "a": "Three to four lines / about 100 words (500 symbols max)", "e": "Paragraphs should not exceed 500 symbols — roughly 100 words or 3-4 lines in the transcription tool. This keeps long conversational passages readable. Lyrics are the exception and are formatted like a poem."}, {"q": "How are movie/book/magazine/song/artwork/play/TV-program titles transcribed? (Italics / special formatting.)", "a": "a — Always bolded", "e": "Film, book, magazine, song titles — as well as artworks, plays, TV and radio programs, and foreign expressions — must be italicized. Social media sites, company names, the Bible and books within it are NOT italicized."}, {"q": "Which is the correct way to timestamp speaker changes?", "a": "a — [00:00:00] Speaker:", "e": "Timestamps must always be written in the format [00:00:00] and always bolded. Two timestamping types exist: every 2 minutes, and every time the speaker changes. Timestamps must reflect the whole file's timing, not just the segment you are working on."}, {"q": "If the speaker uses swear words — should they be transcribed?", "a": "a — Transcribe them", "e": "The guidelines are explicit: if there are curse words in the audio, transcribe them word for word. Clean verbatim does not censor or omit them."}, {"q": "How should the translation be written? (Which option is correct?)", "a": "Not determinable from the fetched guidelines — verify with GoTranscript's official translator guidance", "e": "Rule unverified — the fetched transcription guidelines do not specify a separate formatting rule for translations. Please check GoTranscript's official translator guidance before answering."}, {"q": "The style-guide rule applies to all speakers in the audio. (Which statement?)", "a": "True — style-guide rules apply to all speakers consistently", "e": "The style-guide rules apply to every speaker in the audio, not just the main one. Speaker labels, sound-event notation, timestamps and formatting rules are used consistently for all speakers, and a speaker label is required even when there is only one speaker."}, {"q": "How should conjunctions / connecting words be transcribed?", "a": "a — When a sentence is too long, removing the conjunction may leave it perfectly understandable.", "e": "In clean verbatim, conjunctions (and, so, but) joining long stretches of thought should be cut when the sentence stays perfectly understandable without them — often by splitting into separate sentences. Avoid starting phrases with conjunctions; if a conjunction is truly needed, expand the sentence instead."}, {"q": "Quotation marks: which usage is correct?", "a": "Use double quotation marks for direct quotations, introduced by a comma (never a colon)", "e": "Double quotation marks are used for every direct quotation, and quotations are introduced by a comma — never a colon. Internal dialogues count as direct quotations too: 'And then I thought to myself, \"What if I can't make it?\"' — the first word of a complete quoted sentence is capitalized, and the question mark stays inside the quotes when the quotation itself is the question."}, {"q": "How are numbers transcribed in Hindi? (e.g. numbers 0–9/1–9 spelled out vs numerals)", "a": "Not determinable from the fetched guidelines — verify with GoTranscript's official Hindi guidance", "e": "Rule unverified — the official English guidelines simplify numbers by spelling out single digits and using numerals for 10 and up, but Hindi-specific number rules are not covered on the fetched guidelines page, and the source video left this debated and unsettled. Please check GoTranscript's official Hindi guidance."}, {"q": "How is 'unintelligible' transcribed? (Same in all languages.)", "a": "b — [inaudible 00:00:00]", "e": "When a word can be heard but not understood (accent, manner of speech), mark it [unintelligible 00:00:00]; when speech cannot be heard at all due to noise or poor recording, use [inaudible 00:00:00]. Note: neither listed option shows [unintelligible 00:00:00] — the correct per-guideline marking is not among these two options, so match by rule, not by letter. [silence] is only for 4-10 second pauses."}, {"q": "Which of the following statements is correct?", "a": "a — A longer speech should be separated into paragraphs of a maximum of 500 characters.", "e": "This question bundles several rules: timestamps are placed every 2 minutes; a speaker label is required even with one speaker; longer speeches are split into paragraphs of max 500 symbols; company names must be researched for correct spelling; every transcription is checked by editors (ratings 1-5); false starts are omitted in clean verbatim unless they add information; significant sound events are noted regardless of format — never skipped."}, {"q": "What is timestamping, and what are the types of timestamps?", "a": "c — Timestamping is the process of recording a specific time in an audio file. The types of timestamping are on speaker change, every 10 seconds, every 30 seconds, or every 2 minutes, unless the client specifies otherwise.", "e": "Timestamping means recording the audio time at key points. The two types are: every time the speaker changes, and every 2 minutes — unless the client specifies otherwise. The format is always bold [00:00:00], and it must reflect the whole file's timing."}, {"q": "What punctuation marks you shouldn't use?", "a": "c — Exclamation marks", "e": "The guidelines state plainly: never use exclamation marks. Every sentence ends with a normal punctuation mark (period, question mark, or comma where grammar requires). Commas and question marks are normal punctuation and are used wherever the sentence needs them."}, {"q": "Which of the following is the proper format of a speaker label?", "a": "c — Speaker", "e": "Speaker labels must be written in bold, followed by a colon and exactly one space (never a tab), e.g. 'Speaker 1:'. Descriptive labels are preferred — Interviewer, Host, Participant 1 — and a '?' is added before the label when the speaker cannot be identified. (Option letters repeat in the source listing; the last option shown is 'Speaker--'.)"}, {"q": "Which of the following words are spelled correctly? (English UK)", "a": "c — Storey", "e": "GoTranscript's default is US spelling unless a client requests otherwise — but this is the English UK test, which asks for British forms: 'cheque' and 'storey' are the UK spellings, while 'signaling' is the US form (UK: 'signalling' with a double l). Match the option whose spelling is British."}, {"q": "If a speaker makes a grammatical error, what should you do?", "a": "b — Transcribe exactly what the speaker said, and do not correct the grammatical error.", "e": "Never correct grammatical errors made by the speakers — transcribe exactly what was said. A 2019 guideline update explicitly removed the [sic] tag, so errors are written plainly with no tag attached."}, {"q": "If you stumble upon an audio that is partially in i.e. French and partially in English, logged under English, what do you do?", "a": "a — Transcribe only French.", "e": "If a language other than the job's language is spoken, mark it with [foreign language] — or [French language], [German language] etc. if it can be identified — instead of transcribing it. Common expressions, names and titles are the exception and must be researched. If the whole file is in the wrong language, report it."}, {"q": "Select the correct rules for transcribing numbers.", "a": "a — At the start of a sentence, write the number in words, even if it would normally be a numeral.", "e": "Spell out single-digit numbers and use numerals for everything else (zero, nine, 10 and so on). At the start of a sentence, always write the number in words. If one sentence combines small and large numbers, write ALL of them as numerals for readability."}, {"q": "What is the main difference between CV and FV?", "a": "c — CV doesn't include repetitions and stutters, while FV does.", "e": "Full verbatim transcribes everything exactly as it sounds — speech errors, false starts, filler words, slang, stutters and repetitions. Clean verbatim omits all of those (except repetitions that express emphasis, like 'No, no, no'). Swear words are transcribed word for word in both."}, {"q": "Which abbreviations/acronyms are incorrectly written?", "a": "b — K.N.S.", "e": "Abbreviations and acronyms must not contain dashes or periods: USA and PhD are right; U.S.A. and Ph.D. are wrong. So N.H.S. with periods breaks the rule, while NHS is written correctly."}, {"q": "Which of the following are considered filler words?", "a": "c — I mean, you know, sort of", "e": "Filler words are words the speaker uses excessively that add no meaning and can be removed cleanly: um, uh, kind of, sort of, I mean, you know. 'Oh, my God' is an expression that must be kept regardless of verbatim type — it is not a filler. 'Ni-nii' is a stutter/repetition, not a filler word. (Options partially legible; letters repeat in the source listing.)"}, {"q": "Which of the following quotes contains incorrect punctuation?", "a": "b — The UK uses these shorthands heavily in government business, and everyday text and internet communication.", "e": "Watch conjunction and comma placement: in clean verbatim, unnecessary conjunctions are cut and sentences are divided where meaning is clearest. A comma — not a colon — introduces a direct quotation, and commas and periods always go inside quotation marks. Options that pile up conjunctions or misplace the colon break these rules."}, {"q": "Which of these words are spelled correctly? (English UK)", "a": "a — Analyse", "e": "For the English UK test, British spellings apply: 'analyse' is the UK form (US: analyze), 'defence' is UK (US: defense), 'sceptic' is UK (US: skeptic). Only the option spelled the British way matches the UK test."}, {"q": "The correct form(s) of affirmation for Full Verbatim is (are):", "a": "a — Mm-hmm, uh-huh, uh-huh", "e": "In full verbatim, only these affirmation forms are allowed: Mm-hmm and Mm for affirmative, Mm-mm for negative, Uh-huh for affirmative, Uh-uh for negative. Any other rendering (extra syllables, made-up forms) breaks the rule."}, {"q": "Which of the following options represents the correct way of transcribing dates (English UK)?", "a": "c — 14 May 2026", "e": "Rule unverified — the fetched guidelines cover times of day (2:45 PM; eleven o'clock spelled out) but do not specify a UK date format. Please check the official guidelines or test source rather than guessing; do not treat the marked letters as the answer."}, {"q": "Choose the correct spelling (English UK)?", "a": "a — Flavour", "e": "British spelling: 'flavour' is the UK form; 'flavor' is US. The guideline default is US spelling unless the client asks otherwise — but this quiz is the English UK test, so the British form is expected."}, {"q": "If the speaker spells out their name, what is the correct transcription?", "a": "c — L-I-L-L-Y", "e": "When a speaker spells a name, write the letters separated by dashes: 'My name is Anna. A-N-N-A.' Periods, commas, slashes or underscores between letters are wrong."}, {"q": "If there is more than one speaker, how should they be all noted?", "a": "b — Speaker 1, Speaker 2, et cetera. If you can distinguish a speaker's role in the conversation, you should make it as descriptive as possible.", "e": "Use numbered, descriptive speaker labels: Speaker 1, Speaker 2 — and make each speaker's role as descriptive as possible (Interviewer, Participant 1, Host). Labels are bold, followed by a colon and one space. Never leave speakers unseparated or expect an editor to fix it."}, {"q": "What should not be omitted in Clean Verbatim?", "a": "a — Slang words", "e": "In clean verbatim, repetitions, stutters, speech errors, false starts and filler words are omitted — but slang is not omitted, it is normalized to full forms (gonna becomes going to), and swear words are never omitted: they are transcribed word for word."}, {"q": "When to use [pause 00:00:00]?", "a": "c — When there is a silent chunk longer than 10 seconds", "e": "The [pause 00:00:00] tag is bolded, timestamped, and always placed on a separate line. It marks a significant pause — longer than 10 seconds. Shorter pauses (4-10 seconds) use [silence]; anything under 4 seconds is not tagged."}, {"q": "Which form is the correct one when showing affirmation? Full Verbatim", "a": "d — Mm-hmm", "e": "Full verbatim allows only: Mm-hmm / Mm (affirmative), Mm-mm (negative), Uh-huh (affirmative), Uh-uh (negative). 'Ok' or 'OK' must never be written — it is always 'Okay'; 'alright' is written 'all right'. A bare 'Mm' on its own is an accepted affirmative form."}, {"q": "Which of the following sentences contains incorrect punctuation?", "a": "a — \"I love the new design\" - said the architect - \"but it requires more space.\"", "e": "Direct quotations use double quotation marks and are introduced by a comma, not a dash or colon: '\"I love the new design,\" said the architect, \"but it requires more space.\"' Commas and periods always go inside the quotation marks, and the quoted sentence starts capitalized."}, {"q": "Which of the following sound events is correctly transcribed?", "a": "c", "e": "Sound events are written in square brackets, lowercase, present tense, max two words: [silence]. Capitalized [Silence], slashes, or parentheses are all wrong — the rule is explicit that lowercase applies regardless of the tag's position in a sentence."}, {"q": "A Full Verbatim file contains:", "a": "a — Stutters and repetitions.", "e": "A full verbatim file contains everything: stutters, repetitions, speech errors, false starts and filler words — the text is transcribed exactly as it sounds, including all utterances of the speakers."}, {"q": "Do you have to transcribe stutters? Full Verbatim", "a": "a — Yes. For instance, \"I-I, um, uh, love, uh, bas-basketball.\"", "e": "Yes — in full verbatim, stutters are transcribed exactly as heard, e.g. 'I-I went to the bank last Tu-Thursday.' Stutters are only removed in clean verbatim."}, {"q": "How should you mark an incomplete thought due to a change of thought or incomplete sentences that add some extra information? Full Verbatim", "a": "e — I would like to go to Colombia-- Yes, I love Spanish and Cumbia.", "e": "A change of thought or false start is marked with a double dash, then a space, then the new thought: 'I would like to go to Colombia -- Yes, I love Spanish and Cumbia.' A single dash is for interruptions where the speaker continues, and a period would wrongly split it into two separate sentences."}, {"q": "How should you transcribe a company's name?", "a": "b — According to the research on Google, LinkedIn, YouTube, et cetera.", "e": "Always research the proper spelling and capitalization of names and companies — e.g. on Google, LinkedIn, YouTube. Never transcribe a company name 'the way it sounds'."}, {"q": "Which of the following, slang words or spoken contractions, should be transcribed in a Clean Verbatim file the way it is said?", "a": "b — Spoken contractions", "e": "In clean verbatim, slang words are normalized to their full forms (gonna becomes going to, wanna becomes want to). Spoken contractions, however, are never changed — y'all, ain't, can't, don't, it's stay exactly as said, regardless of verbatim type."}, {"q": "Which sentence is written correctly?", "a": "b — I have never forgotten my mother's advice.", "e": "This question is about the transcriber's own sentence, not the speaker's: your own writing must be grammatically correct ('I have never forgotten my mother's advice'). Never correct the speaker's errors — but your own sentences follow normal grammar."}, {"q": "Which tags should be bolded?", "a": "b — Everything with the timecodes: [00:00:15], [unintelligible 01:01:27], [inaudible 00:03:13], [pause 00:02:07]", "e": "Bold is used for: everything with a timestamp — [pause 00:04:24], [unintelligible 01:01:27], [inaudible 00:03:13], [00:00:15] — and speaker labels. Nothing else may be bolded."}, {"q": "Gina is __ friend from Poland.", "a": "c — a", "e": "Rule unverified in the fetched GoTranscript guidelines — this tests basic English grammar, not a transcription rule. Standard grammar: 'Gina is a friend from Poland' (the article 'a' before a consonant sound)."}, {"q": "He__ my brother.", "a": "c — is", "e": "Rule unverified in the fetched GoTranscript guidelines — basic English grammar: 'He is my brother' (third-person singular takes 'is')."}, {"q": "How should significant sound events be noted in Clean Verbatim?", "a": "c — [laughter] (as seen in source)", "e": "Significant sound events are noted in square brackets, lowercase, present tense, max two words — [laughter] — regardless of verbatim type. Parentheses or capital letters are never used for sound events."}, {"q": "How should the names of the films, books, magazines, song titles, artworks, plays, TV [and radio programs, foreign expressions be written]?", "a": "a — It should be bolded.", "e": "Film, book, magazine, song, artwork, play, TV and radio program titles — and foreign expressions — must always be italicized. There is no option to bold them or leave them unformatted."}, {"q": "How should you transcribe spoken contractions (Y'all, ain't, can't, don't, it's) in Clean Verbatim?", "a": "a — Y'all, ain't, can't, don't, it's.", "e": "Never change spoken contractions: y'all, ain't, can't, don't, it's are kept exactly as said, in both clean and full verbatim. Expanding them to full forms is wrong."}, {"q": "I ___ a freelancer.", "a": "am (I am a freelancer)", "e": "Rule unverified in the fetched GoTranscript guidelines — basic English grammar (first person takes 'am'). Options were cut off in the source video's stitched image, so match by grammar only and confirm against the quiz source."}, {"q": "I __ a good student.", "a": "am (I am a good student)", "e": "Rule unverified in the fetched GoTranscript guidelines — basic English grammar: 'I am a good student' (first person takes 'am')."}, {"q": "I have __ and __.", "a": "a — $1, £10", "e": "Money is an exception to the spell-out rule: write amounts as numerals with the symbol — $1, £10 (and $1,000, $1.5 million). 'One US dollar, ten British pounds' in words is wrong for currency."}, {"q": "If a speaker had made a grammatical mistake, how would a worker have to transcribe it (For instance, \"I has a puppy.\")?", "a": "b — Do not correct grammatical errors made by the speaker. \"I has a puppy.\"", "e": "Never correct grammatical errors made by the speaker, and never use the [sic] tag — a 2019 guideline update explicitly removed it. Transcribe the error exactly as said: 'I has a puppy.'"}, {"q": "If a speaker spells a name, how should it appear in the transcription?", "a": "a — My name is Gintare. G-I-N-T-A-R-E.", "e": "Spelled-out names use dashes between letters: 'My name is Gintare. G-I-N-T-A-R-E.' Underscores, slashes or no separators are wrong."}, {"q": "If I were a boy, I ___ understand.", "a": "a — could", "e": "Rule unverified in the fetched GoTranscript guidelines — basic English grammar (second conditional): 'If I were a boy, I could understand.'"}, {"q": "If there is a combination of single-digit numerals and all other numerals in the same sentence (For example, \"I have 1 pen and 15 pencils\"), how will you transcribe it?", "a": "b — I have 1 pen and 15 pencils (this way improves readability since 1 and 15 are on the same line).", "e": "When a sentence combines small (0-9) and large (10+) numbers, transcribe ALL of them as numerals for readability. So a sentence with '1 pen and 15 pencils' keeps both as numerals."}, {"q": "If there is a name/surname you can't make out due to a speaker's manner of speech, what are you supposed to do?", "a": "c — Mark it as [unintelligible 00:00:00]", "e": "A name you can hear but cannot make out because of the speaker's manner of speech is marked [unintelligible 00:00:00] — unintelligible means heard but not understood. Never guess a name from context. (Note: the plain [unintelligible] without a timestamp is incomplete per the guidelines.)"}, {"q": "If there is a sound of laughter made not by the speaker but by other people, should, if at all, it be included in the transcription? Full Verbatim.", "a": "[laughter] — include it (significant sounds are always noted)", "e": "Significant sounds are noted regardless of verbatim type, in brackets, lowercase, present tense — so others' laughter is [laughter]. When the sound occurs while someone is talking, the tag goes on the same line; ambient sounds go on separate lines."}, {"q": "If there is an 'et cetera' in the audio, what should you do?", "a": "b — Transcribe 'et cetera' as a part of the audio.", "e": "Do not remove the word 'et cetera' unless the client asks otherwise in the comments. It is transcribed as part of the audio."}, {"q": "If you couldn't understand something, what would you do?", "a": "c — Mark that word as unintelligible with the specified time [unintelligible 00:00:13].", "e": "If you cannot understand something, mark it [unintelligible 00:00:13] with the exact timestamp. The guidelines forbid making up your own markings, guessing the word from context, or skipping it silently."}, {"q": "If you do not transcribe audio according to GoTranscript's guidelines, what will happen?", "a": "a — You might be removed from the team.", "e": "The guidelines warn: if you do not prepare transcriptions according to the requirements, you might be removed from the team of transcribers. Every file is checked by editors with ratings 1-5, and new transcribers averaging 3.6 or lower after 3 files are removed — so both a low rating and removal are real consequences."}, {"q": "It is a problem that needs to be dealt ___", "a": "d — with", "e": "Rule unverified in the fetched GoTranscript guidelines — standard English collocation: 'a problem that needs to be dealt with' (deal + with)."}, {"q": "Please read the guidelines before filling __ application form.", "a": "a — out the", "e": "Rule unverified in the fetched GoTranscript guidelines — standard English collocation: 'fill out the application form' (fill out + the)."}, {"q": "Sounds made not by the person speaking are always:", "a": "It depends — ambient noise on a separate line; a significant sound while the speaker talks goes on the same line", "e": "It depends on the sound: ambient noise goes on a separate line as [background noise]; but a significant unidentified sound that occurs while the speaker is talking is noted on the same line. Both are lowercase bracket tags in present tense. Neither absolute option captures this distinction — match by rule."}, {"q": "The girl is in her late __", "a": "c — 20s", "e": "Age is an exception to the spell-out rule: write ages as numerals — 70s, 30s — so 'her late 20s'. Lowercase 's', no apostrophe."}, {"q": "Vilnius ___ has around 723,000 permanent inhabitants.", "a": "a — , the capital of Lithuania,", "e": "Rule unverified in the fetched GoTranscript guidelines — standard grammar and spelling: an apposition is set off with commas ('Vilnius, the capital of Lithuania, has...') and the country is spelled 'Lithuania'."}, {"q": "What are the types of timestamping?", "a": "a — Change of a Speaker", "e": "The two timestamping types: every time the speaker changes, and every 2 minutes — unless the client specifies otherwise. Always in bold [00:00:00] format, reflecting the whole file."}, {"q": "What is a correct format of the website links?", "a": "b — www.facebook.com/groups/gotranscriptofficial", "e": "Links are always written in plain URL form: www.facebook.com/groups/gotranscriptofficial. Never write them spelled out ('www dot facebook dot com slash...')."}, {"q": "What is the correct form of addressing internal dialogues?", "a": "c — Then I told myself, \"What if I can't make it\"", "e": "Internal dialogues are treated as direct quotations: 'Then I told myself, \"What if I can't make it?\"' — the first word of the quoted sentence is capitalized, and the question mark goes inside the quotation marks because the quotation itself is a question."}, {"q": "What is the correct way to mark False Starts in Full Verbatim?", "a": "a — I went to-- I slept well last night", "e": "False starts in full verbatim are marked with a double dash: 'I went to-- I slept well last night.' There is no option to skip marking them in FV — false starts are part of 'transcribed exactly as it sounds'."}, {"q": "What is the rule about \"[]\" in GT guidelines?", "a": "b — \"[]\" should never be used for the timestamps. For instance, [ 00:01:00] is a correct form of time-stamping, and (00:00:00) isn't.", "e": "Square brackets are the required notation for sound events and timestamps — [00:01:00], [pause 00:02:07]. The guidelines explicitly say: never use () instead of []. (Note: the option text as shown in the source is oddly worded; the underlying rule is that brackets, not parentheses, are used.)"}, {"q": "What is the rule about slang words in Clean Verbatim?", "a": "b — Examples of slang words are: gonna, wanna, kinda. It has to be written respectively as going to, want to, kind of.", "e": "In clean verbatim, slang must be written in full: gonna becomes going to, wanna becomes want to, kinda becomes kind of. Transcribing slang as said is only correct in full verbatim."}, {"q": "What should a correct sentence look like?", "a": "b — They took me to the hospital two weeks ago-- no, four weeks ago.", "e": "A self-correction (speech error) is marked with a double dash: 'They took me to the hospital two weeks ago-- no, four weeks ago.' The false start is kept because it adds information, and '--' joins it to the correction."}, {"q": "What should you do with curse words?", "a": "a — Transcribe them word for word.", "e": "Curse words are transcribed word for word — clean verbatim never omits or censors them."}, {"q": "Which forms are NOT appropriate to use for affirmations in Full Verbatim?", "a": "a — Uh-uhn", "e": "Full verbatim allows only these affirmation forms: Mm-hmm / Mm (affirmative), Mm-mm (negative), Uh-huh (affirmative), Uh-uh (negative). Renderings like Uh-uhn, Aha or Ammm are not on the allowed list — while Uh-huh, Mm and Mm-hmm are legitimate."}, {"q": "Which is the correct format according to GT guidelines?", "a": "b — She came to me and said, \"I am from Mozambique. M-O-Z-A-M-B-I-Q-U-E.\"", "e": "Spelled-out letters use dashes: 'M-O-Z-A-M-B-I-Q-U-E.' The spoken sentence is a direct quotation introduced by a comma: 'She came to me and said, \"I am from Mozambique. M-O-Z-A-M-B-I-Q-U-E.\"' — without the quotes around the direct speech, the format is wrong."}, {"q": "Which sentence is correctly capitalized and punctuated?", "a": "d — Yes, Ana. You can do this.", "e": "Every sentence begins capitalized and ends with a punctuation mark; a comma follows an introductory 'Yes': 'Yes, Ana. You can do this.' Lowercase sentence starts or missing commas break the rule."}, {"q": "Which sentence is punctuated correctly?", "a": "c — In the first place, modern communicators have made it possible for many people to work from home.", "e": "An introductory phrase is followed by a comma: 'In the first place, modern communicators have made it possible for many people to work from home.' A comma must not split the subject from its verb."}, {"q": "Which sentence is written and capitalized correctly? Clean Verbatim.", "a": "d", "e": "In clean verbatim, slang is normalized to full forms: 'gotta' becomes 'got to' — 'It has got to be called incumbent.' Transcribing slang as said is only correct in full verbatim."}, {"q": "اسپیکر لیبل لکھنے کا درست طریقہ کیا ہے؟", "a": "c", "e": "Speaker labels must be written in bold, followed by a colon and one space (e.g. Speaker 1:). If the speaker's name is mentioned, use it as the label. A label is required even when there is only one speaker."}, {"q": "اگر آڈیو میں کوئی آواز سنائی دے؟ [sounds question]", "a": "b", "e": "Significant sounds are noted in square brackets, lowercase, present tense (e.g. [laughter]). Ambient noise goes on a separate line as [background noise]."}, {"q": "فل ورسیم میں نامکمل جملوں کو لکھنے کا درست طریقہ کیا ہے؟", "a": "a", "e": "In full verbatim, an incomplete sentence or change of thought is marked with a double dash: 'I wanted to say something but--'. A single dash is only for interruptions where the speaker continues."}, {"q": "کیا کلین ورسیم ٹرانسکرپشن میں بیک گراؤنڈ شامل ہوتی ہے؟", "a": "a", "e": "Significant sound events are noted regardless of verbatim type — so background noise is marked in clean verbatim too, using [background noise]."}, {"q": "اگر پچھلی سطور زیادہ لمبی ہوں تو آپ کو کیا کرنا چاہیے؟", "a": "b", "e": "Paragraphs must not exceed 500 symbols (about 100 words / 3-4 lines). If previous lines are too long, split the speech into smaller paragraphs."}, {"q": "اگر آپ کو ٹرانسکرپشن کی ہدایات کے مطابق آڈیو ٹرانسکرائب نہ کرنے کو کہا گیا ہو؟", "a": "a", "e": "Rule unverified in the fetched guidelines — per the guidelines, special client instructions in the file comments can override defaults (e.g. embedded time, dictation formatting). Options were partially legible in the source; verify against the official quiz."}, {"q": "کیا کلین ورسیم ٹرانسکرپشن میں ٹائم اسٹیمپ شامل ہوتے ہیں؟", "a": "a", "e": "Timestamps are used in both clean and full verbatim — every 2 minutes and on every speaker change, always bold [00:00:00] — unless the client specifies otherwise."}, {"q": "گالیوں والے یا برے الفاظ کے ساتھ آپ کو کیا کرنا چاہیے؟", "a": "b", "e": "Curse words are transcribed word for word. Clean verbatim never censors or omits them."}, {"q": "کیا آپ کو اسپیکر لیبل استعمال کرنے کی ضرورت ہے؟", "a": "b", "e": "Always use a speaker label, even if there is only one speaker. Labels are bold, followed by a colon and one space."}, {"q": "آڈیو فائل کو ٹرانسکرائب کرتے وقت کلین ورسیم کے بنیادی اصول یہ ہیں:", "a": "a", "e": "Clean verbatim is the foundation: it omits speech errors, false starts (unless they add information), stutters, repetitions and filler words; slang is expanded to full forms; the speaker's meaning is never paraphrased."}];

function norm(s){return s.toLowerCase().replace(/[^\p{L}\p{N}\s]+/gu,' ').replace(/\s+/g,' ').trim();}
function bigrams(s){const t=' '+norm(s)+' ';const b=[];for(let i=0;i<t.length-1;i++)b.push(t.slice(i,i+2));return b;}
function dice(a,b){
  const A=bigrams(a),B=bigrams(b);
  if(!A.length||!B.length)return 0;
  const counts={};A.forEach(x=>counts[x]=(counts[x]||0)+1);
  let inter=0;B.forEach(x=>{if(counts[x]>0){counts[x]--;inter++;}});
  return (2*inter)/(A.length+B.length)*100;
}
function tokenScore(a,b){
  const at=new Set(norm(a).split(' ').filter(Boolean));
  const bt=new Set(norm(b).split(' ').filter(Boolean));
  if(!at.size||!bt.size)return 0;
  let inter=0;at.forEach(t=>{if(bt.has(t))inter++;});
  const recall=inter/at.size;
  const jaccard=inter/(at.size+bt.size-inter);
  return (0.7*recall+0.3*jaccard)*100;
}
function similarity(a,b){
  const na=norm(a),nb=norm(b);
  if(!na||!nb)return 0;
  if(na===nb)return 100;
  if(nb.includes(na)&&na.length>10)return 96;
  return Math.max(dice(a,b),tokenScore(a,b));
}
const THRESHOLD=62;

  submitBtn.textContent='Searching\u2026';
  statusBox.hidden=true;answerCard.hidden=true;explanationCard.hidden=true;
  let best=null,bestScore=0;
  for(const item of QA){
    const s=similarity(question,item.q);
    if(s>bestScore){bestScore=s;best=item;}
  }
  if(!best||bestScore<THRESHOLD){
    statusBox.textContent='No matching answer found. Try rephrasing your question.';
    statusBox.className='status status-not-found';statusBox.hidden=false;
  }else{
    document.getElementById('answer-text').textContent=best.a;
    document.getElementById('explanation-text').textContent=best.e||'No explanation has been added for this question yet.';
    answerCard.hidden=false;explanationCard.hidden=false;
    statusBox.textContent='Best match: '+Math.round(bestScore)+'%';
    statusBox.className='status status-match';statusBox.hidden=false;
  }
  submitBtn.disabled=false;

});

</div>
</div>
<script>
(function(){
  var overlay=document.getElementById('welcome-modal');
  var stepName=document.getElementById('modal-step-name');
  var stepSub=document.getElementById('modal-step-sub');
  var nameInput=document.getElementById('visitor-name');
  var saved=null;
  try{saved=localStorage.getItem('qa_visitor_name');}catch(e){}
  function showStep(which){
    overlay.hidden=false;
    stepName.hidden=(which!=='name');
    stepSub.hidden=(which!=='sub');
  }
  function greet(name){
    document.getElementById('sub-name').textContent=name||'Dost';
    showStep('sub');
  }
  document.getElementById('name-continue').addEventListener('click',function(){
    var n=nameInput.value.trim();
    if(n){try{localStorage.setItem('qa_visitor_name',n);}catch(e){}}
    greet(n||'Dost');
  });
  nameInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.getElementById('name-continue').click();}});
  document.getElementById('name-skip').addEventListener('click',function(){greet(saved||'Dost');});
  document.getElementById('sub-close').addEventListener('click',function(){overlay.hidden=true;});
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.hidden=true;});
  if(saved){greet(saved);}else{showStep('name');if(nameInput)setTimeout(function(){nameInput.focus();},300);}
})();
</script>
</body>
</html>
