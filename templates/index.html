<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question Answer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page-shell">
    <section class="app-card">
      <header class="brand">
        <div class="brand-mark">Q</div>
        <h1>Question Answer</h1>
        <p>Ask a question. Get a clear answer.</p>
      </header>

      <form id="ask-form" class="question-form">
        <label for="question">Your question</label>
        <textarea id="question" name="question" rows="3" placeholder="Type your question here..." required></textarea>
        <button id="submit-btn" type="submit">Find answer <span aria-hidden="true">→</span></button>
      </form>

      <div id="status" class="status" role="status" aria-live="polite" hidden></div>

      <section id="answer-card" class="result-card" hidden>
        <div class="result-heading"><span class="dot answer-dot"></span><h2>Answer</h2></div>
        <p id="answer-text" class="result-text"></p>
      </section>

      <section id="explanation-card" class="result-card explanation-card" hidden>
        <div class="result-heading"><span class="dot explanation-dot"></span><h2>Explanation</h2></div>
        <p id="explanation-text" class="result-text"></p>
      </section>

      <footer class="footer">
        <span>Knowledge, made simple.</span>
        <a href="{{ url_for('admin_login') }}">Admin</a>
      </footer>
    </section>
  </main>

<script>
const form = document.getElementById('ask-form');
const questionInput = document.getElementById('question');
const submitBtn = document.getElementById('submit-btn');
const statusBox = document.getElementById('status');
const answerCard = document.getElementById('answer-card');
const explanationCard = document.getElementById('explanation-card');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const question = questionInput.value.trim();
  if (!question) return;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Searching…';
  statusBox.hidden = true;
  answerCard.hidden = true;
  explanationCard.hidden = true;

  try {
    const response = await fetch('{{ url_for("ask") }}', {
      method: 'POST',
      headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
      body: new URLSearchParams({question})
    });
    const data = await response.json();
    if (!data.ok) throw new Error(data.message || 'Something went wrong.');
    if (!data.found) {
      statusBox.textContent = data.message;
      statusBox.className = 'status status-not-found';
      statusBox.hidden = false;
    } else {
      document.getElementById('answer-text').textContent = data.answer;
      document.getElementById('explanation-text').textContent = data.explanation;
      answerCard.hidden = false;
      explanationCard.hidden = false;
      statusBox.textContent = 'Best match: ' + data.confidence + '%';
      statusBox.className = 'status status-match';
      statusBox.hidden = false;
    }
  } catch (error) {
    statusBox.textContent = error.message || 'Could not search right now. Please try again.';
    statusBox.className = 'status status-not-found';
    statusBox.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'Find answer <span aria-hidden="true">→</span>';
  }
});
</script>
</body>
</html>
